# Lightweight correctness CI — runs on every push to main and every PR.
# No Google Cloud, no external sites: fast and safe for forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @demomotion/web exec tsc --noEmit
      - run: pnpm --filter @demomotion/demo-app exec tsc --noEmit
      - run: pnpm -r build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/api
        run: pip install -e '.[dev]'
      - name: Compile
        working-directory: services/api
        run: python -m compileall app
      - name: Tests
        working-directory: services/api
        run: pytest

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format
        working-directory: infra/environments/dev
        run: terraform fmt -check
      - name: Validate
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
