# Build and publish the API image to GitHub Container Registry so other repos can
# run it in CI (see action.yml / the "Use it in your own CI" README section).
# Runs on version tags (v*) and can be triggered manually. After the first run,
# make the ghcr.io/<owner>/demomotion-ai-api package Public so consumers can pull it.
name: Publish API image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build for both architectures so Apple Silicon (arm64) users run the image
      # natively instead of under slow amd64 emulation. QEMU handles the arm64
      # cross-build on the amd64 runner; buildx assembles the multi-arch manifest.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/demomotion-ai-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs so the (emulated) arm64 build stays fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
