# Dogfood / verify the keyless (Workload Identity Federation) path end-to-end:
# authenticate to Google Cloud with NO stored key, then generate a Gemini-narrated
# video via the local action. The provider + service account below are outputs of
# infra/environments/dev (`terraform output wif_provider ci_service_account`) and
# are not secrets. Trigger from the Actions tab.
name: Verify (keyless vertex)

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to record (defaults to the bundled demo-app)
        default: http://localhost:3001
      goal:
        description: What the demo should show
        default: Explain this site for a first-time visitor, focusing on the 3 or 4 most important points.
      language:
        description: Narration language (BCP-47, e.g. ja-JP, en-US)
        default: ja-JP
  # Optional periodic canary for pipeline/keyless-auth regressions. Disabled for
  # now (each run costs GCP and depends on an external site). Uncomment to enable.
  # schedule:
  #   - cron: "0 3 * * 1"   # weekly, Mondays 03:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    # Costs GCP (Gemini/TTS) and hits an external site, so keep it to this repo.
    if: github.repository == 'elderithm/demomotion-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the bundled demo-app
        run: |
          docker compose up -d --build demo-app
          for i in $(seq 1 40); do curl -sf http://localhost:3001 >/dev/null && break || sleep 3; done

      - name: Build the API image
        run: docker build -f services/api/Dockerfile -t demomotion-api:ci .

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          project_id: demomotion-ai-dev
          workload_identity_provider: projects/349855387137/locations/global/workloadIdentityPools/github/providers/github
          service_account: demomotion-ai-runtime@demomotion-ai-dev.iam.gserviceaccount.com

      - name: Generate a Gemini-narrated demo (no key)
        uses: ./
        with:
          image: demomotion-api:ci
          # inputs are only set on manual runs; fall back for scheduled runs.
          url: ${{ inputs.url || 'http://localhost:3001' }}
          goal: ${{ inputs.goal || 'Explain this product for a first-time visitor, focusing on the 3 or 4 most important points.' }}
          language: ${{ inputs.language || 'ja-JP' }}
          ai_provider: vertex
          tts_provider: google
          storage_provider: local
          gcp_project_id: demomotion-ai-dev

      - uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: demo.mp4

      - name: Tear down
        if: always()
        run: docker compose down -v
