services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: demomotion-api
    environment:
      APP_ENV: local
      # Credential-free demo providers: records the bundled demo-app and renders
      # an MP4 with no Google Cloud access. Swap to vertex/google/gcs for cloud.
      AI_PROVIDER: demo
      TTS_PROVIDER: demo
      STORAGE_PROVIDER: local
      OUTPUT_DIR: /app/generated
      PUBLIC_BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    volumes:
      - ./services/api:/app
      - api_generated:/app/generated
    ports:
      - "8080:8080"
    depends_on:
      demo-app:
        condition: service_started
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8080

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: demomotion-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      # Prefill the dashboard with the bundled demo-app so it works out of the box.
      NEXT_PUBLIC_DEFAULT_DEMO_URL: http://demo-app:3001
      NEXT_TELEMETRY_DISABLED: "1"
      # Enable file watching over the mounted source on Docker Desktop (macOS/Windows).
      WATCHPACK_POLLING: "true"
    volumes:
      # Live-reload host edits into the container.
      - ./apps/web:/workspace/apps/web
      # Preserve the image's installed deps / build cache (don't let the mount shadow them).
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  demo-app:
    build:
      context: .
      dockerfile: apps/demo-app/Dockerfile.dev
    container_name: demomotion-demo-app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Enable file watching over the mounted source on Docker Desktop (macOS/Windows).
      WATCHPACK_POLLING: "true"
    volumes:
      # Live-reload host edits into the container.
      - ./apps/demo-app:/workspace/apps/demo-app
      # Preserve the image's installed deps / build cache (don't let the mount shadow them).
      - /workspace/apps/demo-app/node_modules
      - /workspace/apps/demo-app/.next
    ports:
      - "3001:3001"

volumes:
  api_generated:
