# Generate a demo video on each PR and post a link that PLAYS in the browser when
# clicked (no download, no sign-in). Requires storage_provider=gcs so the video is
# hosted on Cloud Storage and the action returns a signed URL. Copy into your repo.
#
# Note: GitHub does not embed external videos inline in a comment, so the link
# opens the MP4 in a new tab (the browser plays it). The signed URL is valid for
# up to ~7 days (Cloud Storage V4 signed-URL maximum).
name: Demo (PR comment, playable link)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write   # keyless Google Cloud auth

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Make the changed page reachable (preview deploy or run-on-runner), then:
      - uses: google-github-actions/auth@v2   # keyless — no key file
        with:
          project_id: your-project-id
          workload_identity_provider: projects/123/locations/global/workloadIdentityPools/github/providers/github

      - id: demo
        uses: elderithm/demomotion-ai@v1
        with:
          url: https://your-app.example.com/features/new-thing
          goal: Introduce the feature changed in this PR for a first-time visitor.
          ai_provider: vertex
          tts_provider: google
          storage_provider: gcs        # host the MP4 → get a playable signed URL
          gcp_project_id: your-project-id

      - uses: actions/github-script@v7
        env:
          VIDEO_URL: ${{ steps.demo.outputs.video-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🎬 **Demo video** for this PR — click to play in your browser:',
                '',
                `▶️ ${process.env.VIDEO_URL}`,
                '',
                '_Hosted on Cloud Storage via a signed URL (valid ~7 days)._',
              ].join('\n'),
            });
