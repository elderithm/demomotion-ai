[project]
name = "demomotion-api"
version = "0.1.0"
description = "DemoMotion AI API and video generation worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  # Pin to the Playwright version whose browsers are baked into the base image
  # (mcr.microsoft.com/playwright/python:v1.58.0-noble). A looser range pulls a
  # newer playwright whose browser build isn't present, breaking BrowserType.launch.
  "playwright==1.58.0",
  "python-dotenv>=1.0.1",
  # Free online TTS used for local/mock narration (no cloud credentials needed).
  "gTTS>=2.5.0",
  "google-cloud-storage>=2.18.2",
  "google-cloud-texttospeech>=2.17.2",
  "google-cloud-aiplatform>=1.69.0",
  "moviepy>=1.0.3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "httpx>=0.27.2", "ruff>=0.6.9"]

[tool.ruff]
line-length = 100
